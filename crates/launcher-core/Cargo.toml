[package]
name = "launcher-core"
version = "0.1.0"
edition = "2021"
description = "Lordaeron launcher: the game folder, the realms' patches and Lumenveil's install, with no UI and no network"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
